name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read the code, nothing more. The deploy job reaches Netlify with its own
# token, not with GitHub's.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # KAN-92: the database tests run against a real PostgreSQL, the version
    # the app is deployed on. They never skip: without this the run fails.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: daykeeper
          POSTGRES_PASSWORD: daykeeper_local_dev
          POSTGRES_DB: daykeeper
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U daykeeper -d daykeeper"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      # KAN-86: the migration checks compare this branch with main. The
      # checkout brings one commit, so main's is fetched beside it.
      - run: git fetch --depth=1 origin +refs/heads/main:refs/remotes/origin/main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # KAN-86: the schema files and the migrations agree, no migration that is
      # on main was edited, and no new one adds a required column with no
      # default. Each failure prints the commands that fix it: the reader is
      # usually a coding agent, and it should be able to put this right alone.
      - name: Migrations agree with the schema and with main
        run: npm run db:check
      - run: npm test
        env:
          DATABASE_URL: postgres://daykeeper:daykeeper_local_dev@localhost:5432/daykeeper
      # KAN-86: the tests prove a migration runs on empty tables. This applies
      # this branch's new migrations to a database built as main has it and
      # filled with the seed's rows, which is what the deployed one looks like.
      # A branch that adds no migration passes at once.
      - name: Rehearse new migrations on a database that holds rows
        run: npm run db:rehearse
        env:
          DATABASE_URL: postgres://daykeeper:daykeeper_local_dev@localhost:5432/daykeeper
      - run: npm run build

  # CD (KAN-86): once build has passed on main, bring the staging database up
  # to date, publish main to the shared preview alias on Netlify, and ask the
  # site whether it can reach its database (docs/deployment.md). Pull requests
  # stop at build. A preview deploy costs no Netlify credits; --prod would cost
  # 15 of 300.
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The staging environment holds the database's address and certificate,
    # and opens only for a run on main. A pull request's run, whatever its copy
    # of this file says, cannot reach the database's structure.
    environment: staging
    # A paused or unreachable database must not hold the queue for six hours.
    timeout-minutes: 10
    # Two merges close together deploy one after the other, never at once.
    # This is also what keeps db:migrate to one run at a time: it takes no
    # lock of its own (src/server/db/AGENTS.md).
    concurrency:
      group: deploy-preview
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The database first, then the code: the new code may need the new
      # structure, and the old code still runs on it in the minutes between.
      # Everything pending is applied in one transaction, so a migration that
      # fails changes nothing, and the deploy below does not happen: the site
      # stays on the version before. With nothing pending it prints
      # "Nothing to apply". The session pooler, port 5432: the address in the
      # environment is not the one the site itself uses (6543).
      - name: Apply new migrations to the staging database
        run: npm run -s db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_CA_CERT: ${{ vars.DATABASE_CA_CERT }}
      # --build runs netlify.toml's build command on this Linux machine. The
      # app's own settings (database, storage, the school's key) stay on
      # Netlify; GitHub holds only the token and which site to deploy to.
      - name: Deploy to Netlify
        run: npx --yes netlify-cli@27.9.0 deploy --build --alias preview --message "main ${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
      # Up is not enough: a site that cannot reach its database fails every
      # page. GET /api/health runs `select 1` and answers 200 or 503
      # (docs/api.md, "Is the site up"). The retries cover a function that is
      # still starting.
      - name: Ask the deployed site whether it can reach its database
        run: curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 --max-time 20 https://preview--daykeeper-group1.netlify.app/api/health

  # KAN-86: a red run on main is everybody's problem and nobody's screen, so it
  # opens an issue that says where to look, or adds to the one already open.
  # Written for whoever reads it first, usually a coding agent.
  # Cancelled counts: that is how a deploy stopped by its ten-minute limit
  # ends, and a hand-cancelled deploy on main deserves a look too.
  report-failure:
    needs: [build, deploy]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.build.result == 'failure' || needs.deploy.result == 'failure' || needs.deploy.result == 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: "main is red: the CI/CD run failed"
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      RUN_ID: ${{ github.run_id }}
      SHA: ${{ github.sha }}
    steps:
      - run: |
          cat > "$RUNNER_TEMP/body.md" <<EOF
          The CI/CD run for \`$SHA\` on main failed: $RUN_URL

          Read the step that failed:

          \`\`\`
          gh run view $RUN_ID --log-failed --repo $GH_REPO
          \`\`\`

          What each place it can fail means:

          - **build**: a check, a test or the build failed on main itself. The log names the step and, for the migration checks, the commands that fix it. Fix it on a branch and open a pull request.
          - **Apply new migrations to the staging database**: nothing was deployed, and the site still runs the version before. PostgreSQL's own message is in the log. A refused connection or a timeout usually means the free Supabase project was paused after seven days with no activity: restore it in the Supabase dashboard, then re-run this workflow.
          - **Deploy to Netlify**: the database already has this commit's migrations and the site still runs the version before. Re-run the workflow.
          - **Ask the deployed site whether it can reach its database**: this commit is live, and GET /api/health did not answer 200. The site's own log on Netlify says why.

          Close this issue when main is green again.
          EOF
          open=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title --jq 'map(select(.title == env.TITLE)) | .[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"
          fi

  # Preview deployment (KAN-86): a pull request gets its own address,
  # https://pr-<number>--daykeeper-group1.netlify.app, so a change can be
  # opened and looked at before it merges. The address goes in a comment on
  # the pull request and stays the same for every push to it.
  #
  # It uses the shared staging database and never changes its structure: only
  # the deploy job, on main, may do that. A pull request that adds a migration
  # under db/migrations will therefore show errors on the pages that need the
  # new structure, which is expected.
  preview:
    needs: build
    # Not for forks: a fork's pull request is given no secrets.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # This job alone may write to the pull request, to leave the comment.
    permissions:
      contents: read
      pull-requests: write
    # A newer push to the same pull request replaces an older preview in flight.
    concurrency:
      group: preview-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v7
      # For the notice below, which reads the migrations this branch adds.
      - run: git fetch --depth=1 origin +refs/heads/main:refs/remotes/origin/main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx --yes netlify-cli@27.9.0 deploy --build --alias "pr-$PR" --message "pr-$PR ${{ github.event.pull_request.head.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
      # One comment per pull request: written the first time, edited after.
      #
      # It opens with a warning when a migration in the pull request drops or
      # renames something that holds data (db/notice.ts prints it, or nothing).
      # The check stays green on purpose: whether data may go is the code
      # owner's decision, and this puts the statement in front of them.
      - run: |
          {
            npm run -s db:notice
            echo
            echo "**Preview of this pull request:** https://pr-$PR--daykeeper-group1.netlify.app"
            echo
            echo "Built from \`${{ github.event.pull_request.head.sha }}\`. It uses the shared staging database, so sign in with your own account. If this pull request adds a migration under \`db/migrations\`, pages that need the new structure will show errors until it merges."
          } > "$RUNNER_TEMP/comment.md"
          gh pr comment "$PR" --edit-last --create-if-none --body-file "$RUNNER_TEMP/comment.md"
        env:
          GH_TOKEN: ${{ github.token }}
