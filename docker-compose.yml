# Local development database and file storage.
#
#   docker compose up -d      start Postgres and MinIO (plus their two viewers)
#   npm run db:reset          build the schema, seed it, empty the bucket
#   docker compose down       stop
#   docker compose down -v    stop and throw the data away
#
# Nothing here is deployed. It exists so that a teammate can clone the
# repository and have a working database in one command, without an account
# anywhere and without waiting for anyone to hand out credentials.
#
# ONE stack serves every checkout. The project name is pinned below so that
# running `docker compose up` from a git worktree joins this same stack
# instead of trying to start a second one (which would fail on the ports).
# Worktrees isolate by database, not by container: see AGENTS.md, Worktrees.

name: daykeeper

services:
  db:
    image: postgres:17-alpine
    container_name: daykeeper-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: daykeeper
      POSTGRES_PASSWORD: daykeeper_local_dev
      POSTGRES_DB: daykeeper
    ports:
      # Deliberately not 5432: a teammate may already run Postgres locally for
      # another unit, and a port collision is a bad first five minutes.
      - "55432:5432"
    volumes:
      - daykeeper_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daykeeper -d daykeeper"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Where the photographs live.
  #
  # The database holds a path; the bytes are objects in here. MinIO speaks the
  # S3 protocol, so the code written against it is the same code that runs
  # against AWS S3, Cloudflare R2 or Supabase Storage later: only the endpoint
  # and the credentials move, and both are environment variables. Reading and
  # writing files on the server's own disk instead would be a second way of
  # doing storage that has to be unwritten before anything is deployed, and it
  # would be unwritten by whoever is deploying, which is the worst moment.
  #
  # See docs/architecture/adr-003-data-storage.md.
  storage:
    image: minio/minio:latest
    container_name: daykeeper-storage
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: daykeeper
      MINIO_ROOT_PASSWORD: daykeeper_local_dev
    ports:
      # 59000 and 59001 rather than 9000 and 9001, for the same reason the
      # database is not on 5432: those two are popular and a collision on the
      # first morning reads like the project is broken.
      - "59000:9000"
      - "59001:9001"
    volumes:
      - daykeeper_storage:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # A database viewer on http://localhost:8080, so nobody has to install a
  # client to look at the tables. Server: db, user/password/database: daykeeper.
  #
  # MinIO brings its own viewer on http://localhost:59001, same credentials,
  # which is where to look when a photograph is meant to have been stored.
  adminer:
    image: adminer:5
    container_name: daykeeper-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  daykeeper_pgdata:
  daykeeper_storage:
